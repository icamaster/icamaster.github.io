# -----------------------------------------------------------------------------
# Homepage cards, in the exact order they appear on the page.
# Reorder by moving entries around; nothing here is date-driven.
#
# Two shapes are accepted:
#
#   - post: my-post-slug          <- a post in _posts/. Title, image, tag and
#                                    blurb are read from its front matter, so
#                                    adding a new article to the homepage is a
#                                    one-line change. The slug is the filename
#                                    without the date and extension:
#                                    _posts/2026-08-01-my-post-slug.md
#
#   - url: https://example.com/   <- anything else: external articles and the
#     title: "..."                   older hand-written pages under /projects/.
#     image: /images/foo.jpg         Spell the fields out here.
#     tag: "AllAboutCircuits Article"
#     blurb: "..."
#
# `tag` is optional and renders bold before the blurb. `blurb` may contain HTML.
# -----------------------------------------------------------------------------

