<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="keywords" content="{{ page.keywords | default: site.keywords }}">
<meta name="author" content="{{ site.author }}">
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">

<title>{% if page.title and page.url != "/" %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}'s Page{% endif %}</title>

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

<!-- Bootstrap core CSS -->
<link href="{{ '/vendor/bootstrap/css/bootstrap.css' | relative_url }}" rel="stylesheet">

<!-- Custom styles for this template -->
<link href="{{ '/css/3-col-portfolio.css' | relative_url }}" rel="stylesheet">

{%- feed_meta -%}

{%- include analytics.html -%}
